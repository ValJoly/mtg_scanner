name: mtg_scanner
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # ocr_scan_text: ^1.3.1
  ocr_scan_text: 
    path: ./sources/ocr_scan_text
  permission_handler: ^11.3.1
  scryfall_api: ^2.0.0
  edge_detection:
    path: ./sources/edge_detection
  path_provider: ^2.1.4
  path: ^1.9.0
  image: ^4.3.0
  sembast: ^3.7.5
  flutter_slidable: ^3.1.1
  flutter_svg: ^2.0.10+1
  expandable_page_view: ^1.0.17
  file_picker: ^8.1.3
  shared_preferences: ^2.3.2
  go_router: ^14.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# add fonts from the assets folder
  assets:
    - assets/
    - assets/icons/
    - assets/icons/mana_costs/

# add fonts from the fonts folder
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-Light.ttf